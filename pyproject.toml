[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powerbench"
version = "0.8.1"
description = "Assumption-aware statistical power analysis with independent verification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Gilad Feldman", email = "giladfel@gmail.com"}]
keywords = [
    "power-analysis", "sample-size", "statistics", "research-methods",
    "reproducibility", "metascience", "study-design", "psychology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "scipy>=1.11",
    # numpy is imported directly by simulation.py and specialist_extras.py, so it is
    # declared rather than relied on as a scipy transitive dependency.
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://powerrmate.vercel.app"
Repository = "https://github.com/giladfeldman/powerbench"
Issues = "https://github.com/giladfeldman/powerbench/issues"
Changelog = "https://github.com/giladfeldman/powerbench/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["powerbench"]

[tool.hatch.build.targets.sdist]
include = ["/powerbench", "/data/scenarios", "/data/benchmarks", "/tests", "/docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long-running Monte Carlo gates; excluded from the default run"]
