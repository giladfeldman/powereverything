# The correctness gate: every analytic reference checked against the independent Monte
# Carlo simulator across three fixed seeds at 12,000 replications.
#
# This is the only test here that can falsify a power formula. Every sample-size function
# is a `while power < target: n += 1` search, so `assert power >= target` passes no matter
# how wrong the mathematics is -- the whole suite once passed with six confirmed defects
# present, including an ordinal reference recommending 191 participants for a design
# needing 614.
#
# Runs nightly rather than per-push because it takes roughly 11 minutes, and on demand for
# any change to a file that can move a number.

name: alignment gate

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "powerbench/references.py"
      - "powerbench/specialist_extras.py"
      - "powerbench/simulation.py"
      - "powerbench/versioning.py"
      - "data/scenarios/**"
      - "tests/test_reference_simulation_alignment.py"

jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Reference vs simulation alignment
        run: python -m pytest -q -m slow tests/test_reference_simulation_alignment.py
