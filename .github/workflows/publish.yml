# Publish to PyPI via Trusted Publishing (OIDC) on a v* tag.
#
# No API token is stored anywhere: PyPI trusts this repository + workflow +
# environment combination directly. The Trusted Publisher must be registered on
# PyPI for giladfeldman/powereverything with workflow name `publish.yml` and
# environment `pypi` BEFORE the first tag is pushed (use "Add a pending
# publisher" while the project does not exist yet).

name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tag must match the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match pyproject.toml version $VERSION" >&2
            exit 1
          fi
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"
          use-public-rspm: true
      # The R adapters adjudicate PowerBench against independent packages; with R present
      # but these missing, every adapter test reports "requires jsonlite and ..." and fails.
      - name: Install R adjudicator packages
        run: |
          Rscript -e 'pkgs <- c("jsonlite","pwr","pwrss","WebPower","gsDesign","powerSurvEpi","rpact","TOSTER","metafor"); install.packages(pkgs); ok <- vapply(pkgs, requireNamespace, logical(1), quietly = TRUE); if (!all(ok)) stop("missing R packages: ", paste(pkgs[!ok], collapse = ", ")); for (p in pkgs) message(p, " ", as.character(packageVersion(p)))'
      - name: Fast test suite
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q
      - name: Build distributions
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
