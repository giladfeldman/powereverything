# Fast test suite on every push and pull request.
#
# The reference-vs-simulation alignment gate is NOT run here: it is replication-heavy and
# runs on a schedule in alignment-gate.yml.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fast suite
        run: python -m pytest -q
