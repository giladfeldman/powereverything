# Fast test suite on every push and pull request.
#
# The reference-vs-simulation alignment gate is NOT run here: it is replication-heavy and
# runs on a schedule in alignment-gate.yml.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"
          use-public-rspm: true
      # The R adapters adjudicate PowerBench against independent packages; with R present
      # but these missing, every adapter test reports "requires jsonlite and ..." and fails.
      - name: Install R adjudicator packages
        run: |
          Rscript -e 'pkgs <- c("jsonlite","pwr","pwrss","WebPower","gsDesign","powerSurvEpi","rpact","TOSTER","metafor"); install.packages(pkgs); ok <- vapply(pkgs, requireNamespace, logical(1), quietly = TRUE); if (!all(ok)) stop("missing R packages: ", paste(pkgs[!ok], collapse = ", ")); for (p in pkgs) message(p, " ", as.character(packageVersion(p)))'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fast suite
        run: python -m pytest -q
